version: 1.0.0-draft
reviewed_at: 2026-09-25
purpose: "Guide-by-guide visual/media production map for MyPets Digital Library launch"
master_map: media/media-placement-master.json
principles:
  - "Use media to teach, orient or create emotional rhythm; do not decorate every paragraph."
  - "Aim for one meaningful visual interruption every 2–4 reading screens."
  - "Prefer MyPets-owned, CC0/public-domain, attributed Creative Commons or official embed media."
  - "Videos remain embedded from official publishers."
  - "Original diagrams should be rendered as accessible HTML/SVG components and have printable equivalents."
  - "All figures need alt text, captions where useful, and attribution when required."
  - "All guide covers use the official round MyPets logo/medallion as an editorial seal; print/PDF may also use it as a low-opacity round watermark."


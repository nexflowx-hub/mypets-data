<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Ciclo de aprendizagem com reforço positivo</title><desc id="d">Sequência didática: sinal claro, comportamento, marcação rápida do acerto e recompensa valiosa para o cão. Comece com baixa dificuldade e sem força.</desc><rect width="1200" height="700" fill="#FAF6EE"/><rect width="1200" height="160" fill="#092D39"/><rect x="54" y="40" width="9" height="75" rx="4" fill="#FF762F"/><text x="81" y="55" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#E9F1E7">MYPETS · TREINO GENTIL</text><text x="81" y="103" font-family="Noto Sans,Arial,sans-serif" font-size="43" font-weight="700" fill="#FFFFFF">O ciclo da aprendizagem</text><text x="81" y="136" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#E9F1E7">Reforce o comportamento que você quer ver novamente.</text><rect x="35" y="220" width="248" height="262" rx="22" fill="#FFFFFF"/><circle cx="159" cy="271" r="31" fill="#E9F1E7"/><text x="150" y="281" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#117767">1</text><text x="59" y="354" font-family="Noto Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#083F38">Sinal claro</text><text x="59" y="400" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Uma palavra ou</text><text x="59" y="430" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">pista consistente.</text><path d="M292 348 h24 m-10 -10 l10 10 -10 10" fill="none" stroke="#FF762F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="329" y="220" width="248" height="262" rx="22" fill="#FFFFFF"/><circle cx="453" cy="271" r="31" fill="#E9F1E7"/><text x="444" y="281" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#117767">2</text><text x="353" y="354" font-family="Noto Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#083F38">Comportamento</text><text x="353" y="400" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Observe a resposta</text><text x="353" y="430" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">que aconteceu.</text><path d="M586 348 h24 m-10 -10 l10 10 -10 10" fill="none" stroke="#FF762F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="623" y="220" width="248" height="262" rx="22" fill="#FFFFFF"/><circle cx="747" cy="271" r="31" fill="#E9F1E7"/><text x="738" y="281" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#117767">3</text><text x="647" y="354" font-family="Noto Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#083F38">Marcador</text><text x="647" y="400" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Diga “sim” no</text><text x="647" y="430" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">momento do acerto.</text><path d="M880 348 h24 m-10 -10 l10 10 -10 10" fill="none" stroke="#FF762F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="917" y="220" width="248" height="262" rx="22" fill="#FFFFFF"/><circle cx="1041" cy="271" r="31" fill="#E9F1E7"/><text x="1032" y="281" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#117767">4</text><text x="941" y="354" font-family="Noto Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#083F38">Recompensa</text><text x="941" y="400" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Entregue algo valioso</text><text x="941" y="430" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">para aquele cão.</text><rect x="35" y="527" width="1130" height="111" rx="20" fill="#E9F1E7"/><text x="65" y="568" font-family="Noto Sans,Arial,sans-serif" font-size="22" font-weight="700" fill="#083F38">O MARCADOR NÃO SUBSTITUI A RECOMPENSA.</text><text x="65" y="604" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Comece fácil, marque rápido e adapte o valor da recompensa ao contexto.</text><text x="36" y="677" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">MYPETS · Original editorial · Sessões curtas, sem força ou intimidação.</text></svg>
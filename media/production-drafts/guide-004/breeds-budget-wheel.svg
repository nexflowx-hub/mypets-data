<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Mapa do orçamento de tutoria responsável</title><desc id="d">Seis categorias de custo: alimentação, veterinário, grooming, treino, transporte e emergências. Os custos variam com o porte, a saúde e a rotina do cão.</desc><rect width="1200" height="760" fill="#FAF6EE"/><rect width="1200" height="154" fill="#083F38"/><rect x="56" y="38" width="9" height="72" rx="4" fill="#FF762F"/><text x="83" y="52" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#E9F1E7">MYPETS · ATLAS 64</text><text x="83" y="98" font-family="Noto Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Orçamento é cuidado contínuo</text><text x="84" y="132" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#E9F1E7">O custo real vai além do alimento e varia com porte, saúde e rotina.</text><path d="M300 246 L476 350 M900 246 L724 350 M300 428 L463 428 M900 428 L737 428 M300 610 L476 526 M900 610 L724 526" stroke="#117767" stroke-width="3" opacity=".45" fill="none"/><circle cx="600" cy="439" r="137" fill="#083F38"/><circle cx="600" cy="439" r="122" fill="none" stroke="#FF762F" stroke-width="4"/><text x="514" y="418" font-family="Noto Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">ORÇAMENTO</text><text x="560" y="453" font-family="Noto Sans,Arial,sans-serif" font-size="32" font-weight="700" fill="#FF762F">REAL</text><text x="511" y="485" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#E9F1E7">ao longo da vida</text><rect x="56" y="193" width="244" height="104" rx="22" fill="#FFFFFF" stroke="#D4E7DF" stroke-width="2"/><text x="74" y="237" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#083F38">Alimentação</text><text x="74" y="268" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">Qualidade e quantidade</text><rect x="900" y="193" width="244" height="104" rx="22" fill="#FFFFFF" stroke="#D4E7DF" stroke-width="2"/><text x="918" y="237" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#083F38">Veterinário</text><text x="918" y="268" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">Prevenção e saúde</text><rect x="56" y="375" width="244" height="104" rx="22" fill="#FFFFFF" stroke="#D4E7DF" stroke-width="2"/><text x="74" y="419" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#083F38">Grooming</text><text x="74" y="450" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">Pelo, pele e manejo</text><rect x="900" y="375" width="244" height="104" rx="22" fill="#FFFFFF" stroke="#D4E7DF" stroke-width="2"/><text x="918" y="419" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#083F38">Treino</text><text x="918" y="450" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">Aprendizagem e apoio</text><rect x="56" y="557" width="244" height="104" rx="22" fill="#FFFFFF" stroke="#D4E7DF" stroke-width="2"/><text x="74" y="601" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#083F38">Transporte</text><text x="74" y="632" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">Viagens e logística</text><rect x="900" y="557" width="244" height="104" rx="22" fill="#FFFFFF" stroke="#D4E7DF" stroke-width="2"/><text x="918" y="601" font-family="Noto Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#083F38">Emergências</text><text x="918" y="632" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">Reserva financeira</text><text x="56" y="731" font-family="Noto Sans,Arial,sans-serif" font-size="16" font
<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Matriz de compatibilidade por estilo de vida</title><desc id="d">Cinco eixos do guia MyPets para investigar energia, manutenção, treinabilidade, sociabilidade e sensibilidade ambiental. Não é um teste de pontuação.</desc><rect width="1200" height="760" fill="#FAF6EE"/><rect width="1200" height="154" fill="#083F38"/><rect x="56" y="38" width="9" height="72" rx="4" fill="#FF762F"/><text x="83" y="52" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#E9F1E7">MYPETS · ATLAS 64</text><text x="83" y="98" font-family="Noto Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Compatibilidade antes da aparência</text><text x="84" y="132" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#E9F1E7">Cinco eixos para investigar — sem reduzir o indivíduo a uma nota.</text><rect x="56" y="178" width="526" height="157" rx="20" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="100" cy="221" r="24" fill="#E9F1E7"/><text x="87" y="229" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#117767">01</text><text x="139" y="226" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#083F38">Energia</text><text x="86" y="273" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#092D39">Movimento, treino e descanso</text><text x="86" y="307" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56716C">Qual ritmo cabe no seu dia real?</text><rect x="618" y="178" width="526" height="157" rx="20" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="662" cy="221" r="24" fill="#E9F1E7"/><text x="649" y="229" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#117767">02</text><text x="701" y="226" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#083F38">Manutenção</text><text x="648" y="273" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#092D39">Escovação, tosa, orelhas e pelagem</text><text x="648" y="307" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56716C">Há tempo e orçamento para cuidar?</text><rect x="56" y="349" width="526" height="157" rx="20" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="100" cy="392" r="24" fill="#E9F1E7"/><text x="87" y="400" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#117767">03</text><text x="139" y="397" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#083F38">Treinabilidade</text><text x="86" y="444" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#092D39">Aprender rápido não é ser fácil</text><text x="86" y="478" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56716C">Como será a rotina de treino?</text><rect x="618" y="349" width="526" height="157" rx="20" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="662" cy="392" r="24" fill="#E9F1E7"/><text x="649" y="400" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#117767">04</text><text x="701" y="397" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#083F38">Sociabilidade</text><text x="648" y="444" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#092D39">História da raça não é garantia</text><text x="648" y="478" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56716C">Como avaliar o cão individualmente?</text><rect x="56" y="520" width="526" height="157" rx="20" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="100" cy="563" r="24" fill="#E9F1E7"/><text x="87" y="571" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#117767">05</text><text x="139" y="568" font-family="Noto Sans,Arial,sans-serif" font-size="28" font-weight="700" fill="#083F38">Sensibilidade</text><text x="86" y="615" font-family="Noto Sans,Arial,sans-serif" font-size="20" font-weight="400" fill="#092D39">Ruído, calor, solidão e novidades</text><text x="86" y="649" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#56716C">O ambiente oferece segurança?</text><rect x="618" y="520" width="526" height="157" rx="20" fill="#083F38"/><text x="651" y="560" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#FF762F">DECISÃO CONSCIENTE</text><text x="651" y="607" font-family="Noto Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">Escolha para o pior</text><text x="651" y="641" font-family="Noto Sans,Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">dia realista.</text><text x="58" y="729" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">MYPETS · Original editorial · Perfis são tendências, não garantias.</text></svg>
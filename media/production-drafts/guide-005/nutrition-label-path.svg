<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">Como ler um rótulo de alimento para cães</title><desc id="d">Checklist de sete informações: espécie, fase de vida, alimento principal ou complementar, energia, instruções, fabricante, lote e validade. Não é prescrição nutricional.</desc><rect width="1200" height="760" fill="#FAF6EE"/><rect width="1200" height="154" fill="#083F38"/><rect x="56" y="38" width="9" height="72" rx="4" fill="#FF762F"/><text x="83" y="52" font-family="Noto Sans,Arial,sans-serif" font-size="17" font-weight="700" fill="#E9F1E7">MYPETS · ALIMENTAÇÃO</text><text x="83" y="98" font-family="Noto Sans,Arial,sans-serif" font-size="40" font-weight="700" fill="#FFFFFF">Leia o rótulo com critério</text><text x="84" y="132" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#E9F1E7">Informação útil vale mais do que uma promessa de marketing.</text><rect x="56" y="179" width="526" height="132" rx="18" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="97" cy="221" r="24" fill="#E9F1E7"/><text x="84" y="229" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#117767">01</text><text x="138" y="225" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#083F38">Espécie</text><text x="83" y="271" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">É formulado para cães?</text><rect x="618" y="179" width="526" height="132" rx="18" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="659" cy="221" r="24" fill="#E9F1E7"/><text x="646" y="229" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#117767">02</text><text x="700" y="225" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#083F38">Fase de vida</text><text x="645" y="271" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Filhote, adulto ou outro estágio?</text><rect x="56" y="325" width="526" height="132" rx="18" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="97" cy="367" r="24" fill="#E9F1E7"/><text x="84" y="375" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#117767">03</text><text x="138" y="371" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#083F38">Tipo de alimento</text><text x="83" y="417" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Principal/completo ou complementar?</text><rect x="618" y="325" width="526" height="132" rx="18" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="659" cy="367" r="24" fill="#E9F1E7"/><text x="646" y="375" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#117767">04</text><text x="700" y="371" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#083F38">Energia declarada</text><text x="645" y="417" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Calorias, quando informadas.</text><rect x="56" y="471" width="526" height="132" rx="18" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="97" cy="513" r="24" fill="#E9F1E7"/><text x="84" y="521" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#117767">05</text><text x="138" y="517" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#083F38">Instruções</text><text x="83" y="563" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Porção inicial e modo de uso.</text><rect x="618" y="471" width="526" height="132" rx="18" fill="#FFFFFF" stroke="#D7E7DF" stroke-width="2"/><circle cx="659" cy="513" r="24" fill="#E9F1E7"/><text x="646" y="521" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="700" fill="#117767">06</text><text x="700" y="517" font-family="Noto Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#083F38">Fabricante</text><text x="645" y="563" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#56716C">Identificação e contato.</text><rect x="56" y="627" width="1088" height="75" rx="17" fill="#083F38"/><text x="82" y="656" font-family="Noto Sans,Arial,sans-serif" font-size="21" font-weight="700" fill="#FF762F">07  LOTE E VALIDADE</text><text x="82" y="686" font-family="Noto Sans,Arial,sans-serif" font-size="19" font-weight="400" fill="#FFFFFF">Guarde a embalagem e confirme as condições de armazenamento.</text><text x="57" y="736" font-family="Noto Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#56716C">MYPETS · Original editorial · Necessidades individuais: consulte o veterinário.</text></svg>
name: EB11 HTML A5 PDF build
on:
  push:
    branches: [eb11-html-a5-production-v1]
    paths:
      - "production/eb11/html-a5/**"
      - ".github/workflows/eb11-html-a5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render HTML to selectable A5 PDF
        run: |
          mkdir -p artifacts
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-pdf-header-footer --virtual-time-budget=10000 \
            --print-to-pdf="$PWD/artifacts/EB11_ADOTEI_UM_CAO_ADULTO_PROVA_HTML_A5.pdf" \
            "file://$PWD/production/eb11/html-a5/v1/index.html"
          test -s "artifacts/EB11_ADOTEI_UM_CAO_ADULTO_PROVA_HTML_A5.pdf"
      - name: Validate PDF pagination and selectable text
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          path="artifacts/EB11_ADOTEI_UM_CAO_ADULTO_PROVA_HTML_A5.pdf"
          reader=PdfReader(path)
          text=" ".join((p.extract_text() or "") for p in reader.pages)
          w,h=map(float,reader.pages[0].mediabox.upper_right)
          assert abs(w-419.53)<3 and abs(h-595.28)<3,(w,h)
          assert len(reader.pages)>=90,len(reader.pages)
          assert len(text)>12000,len(text)
          assert "Adotei um" in text
          assert "O primeiro dia" in text
          assert "O sucesso da adoção" in text
          print(f"PAGE COUNT: {len(reader.pages)} A5 pages")
          print(f"SELECTABLE TEXT: {len(text)} characters")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EB11-A5-HTML-PDF-prova
          path: |
            artifacts
            production/eb11/html-a5/v1/index.html
            library/pt-BR/11-adotei-cao-adulto/guide.md
          if-no-files-found: warn
